name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  # Manual re-trigger lever (Issue #3925). GitHub intermittently accepts a push
  # to `main` WITHOUT emitting the push event to Actions: the commit lands, but
  # no workflow run and no check-suite are ever created (3rd observed occurrence,
  # merge `b11f8cb5`). Because `auto-release.yml` is reachable ONLY via
  # `workflow_run: workflows: ["CI"]`, such a commit is stranded unreleased until
  # some later, unrelated push happens to fire CI. On a PR branch the recovery
  # levers are `update-branch` / close+reopen; on `main` there was NO lever at
  # all. This gives one: `gh workflow run ci.yml --ref main`.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  # e2e-shard jobs pull the pre-built base image from GHCR (Phase 5
  # CI Speedup, task d7d18dd6). Read-only — publish happens in
  # ci-image.yml on push-to-main only.
  packages: read

jobs:
  # Detect whether PR touches code that requires e2e/browser testing.
  # Used to skip heavy jobs (e2e-shard, test-component, performance-tests)
  # on docs-only PRs. R4 mitigation: the `code` filter includes restrictive
  # globs for ANY *.spec.{ts,tsx,js,jsx} or *.test.{ts,tsx,js,jsx} change
  # anywhere in the tree, so a docs PR that inadvertently renames or adds
  # a spec file still triggers e2e (no false-green).
  #
  # Manual override: apply the `force-e2e` label to a PR to force e2e jobs
  # to run even if only docs/** changed (FORCE_E2E equivalent).
  #
  # Push events to main always run e2e (bypass gating via github.event_name).
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      # A manual `workflow_dispatch` is the recovery lever for a stranded `main`
      # commit (Issue #3925), so it must behave like push-to-main: run EVERYTHING,
      # never a docs-only subset. `dorny/paths-filter` has no meaningful base to
      # diff against on a dispatch, so the filter step is skipped and `code` is
      # forced to `true` instead of relying on its (undefined) output.
      code: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.code }}
      force: ${{ steps.force.outputs.force }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect code changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              # R4 mitigation: spec/test files anywhere trigger e2e even if
              # the rest of the diff is docs-only (catches inadvertent spec
              # rename / migration into docs/ or similar directories).
              - '**/*.spec.{ts,tsx,js,jsx}'
              - '**/*.test.{ts,tsx,js,jsx}'
              # Production code & config.
              - 'packages/**'
              - 'scripts/**'
              # CI infrastructure itself (workflows, composite actions,
              # Dockerfiles) must always trigger e2e so workflow changes
              # are validated end-to-end.
              - '.github/workflows/**'
              - '.github/actions/**'
              - '**/Dockerfile*'
              # Dependency & TS config changes that can affect runtime.
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '**/jest.config.*'
              - '**/playwright*.config.*'

      - name: Detect manual override (force-e2e label)
        id: force
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"force-e2e"'; then
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "::notice::FORCE_E2E override active (force-e2e label present)"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps (+ build)
        uses: ./.github/actions/setup-node-pnpm
        with:
          run-build: "true"

      - name: Upload built plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-build
          path: |
            packages/obsidian-plugin/main.js
            packages/obsidian-plugin/manifest.json
          retention-days: 1

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Type check
        run: npm run check:types

  # RFC 0a0791c1 Phase B.0 — supply-chain gate for `packages/core`
  # direct dependencies (incl. nanotar@0.3.0 pinned-exact). Audit runs
  # against the per-package lockfile so pre-existing root-tree vulns in
  # dev tooling (babel, fast-uri) don't trigger noise. Fails the job if
  # any direct dep introduces a high/critical advisory.
  npm-audit-exocortex:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/core/package-lock.json

      # Gate on PRODUCTION dependencies only (--omit=dev). The shipped packages
      # (@kitelev/exocortex-core, -cli, -obsidian-plugin) never bundle the dev
      # toolchain (jest / eslint / babel), so a high advisory reachable only
      # through those build-time deps has zero shipped exposure. The remaining
      # high advisory is brace-expansion GHSA-mh99-v99m-4gvg (DoS), which reaches
      # patched >5.0.7 only via minimatch@10 — and minimatch@10 removes the
      # callable default export that the jest coverage pipeline (test-exclude /
      # babel-plugin-istanbul) depends on, so it cannot be forced without
      # breaking test-coverage. It is tracked upstream (jest/eslint/babel will
      # bump their nested minimatch). The genuine production path (the CLI's
      # runtime `glob`) IS fixed: glob bumped to ^11 → minimatch@10 →
      # brace-expansion@5.0.8, and `--omit=dev` here is 0-high.
      - name: npm audit (block high+ in production deps)
        run: npm audit --audit-level=high --omit=dev
        working-directory: packages/core

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint
        run: npm run lint
        continue-on-error: true

      # D1 CI Path 2 (task e0f6e6fd): guard against shard-assignment drift.
      # Playwright shard configs are hand-maintained lists; this step fails
      # the lint job if a new *.spec.ts lands without being added to exactly
      # one shard (or if a shard references a deleted/renamed spec).
      - name: Validate e2e shard assignments
        run: node scripts/validate-shard-assignments.mjs

      # Issue #4071: a NUL byte in tracked source makes file(1) report `data`, so
      # plain `grep` skips that file SILENTLY (exit != 0, no output) while git grep
      # and rg still match it. The failure mode leaves no trace — a repo-wide search
      # just quietly excludes the file, and silence reads as "no matches". It had
      # already accumulated in SIX files across cli/core/sync/plugin and produced a
      # false code-review finding before anyone noticed, which is exactly why this
      # needs a machine guard rather than review attention. (The byte comes from a
      # tool normalizing an escape into a codepoint, NOT from typing `\0` by hand —
      # the script's header has the measurement.)
      - name: No NUL bytes in tracked source
        run: node scripts/check-no-nul-bytes.mjs

      # packages/cli is excluded from the root tsconfig AND built with esbuild
      # (which does not type-check), so `npm run check:types` — the typecheck job —
      # never looks at it. 24 errors had accumulated there unseen, including a
      # `BlankNode.value` read that shipped through two review rounds of #4070
      # while the compiler had been flagging it the whole time. This ratchets the
      # existing debt (baseline of (file, code) pairs) and fails on anything new.
      # ⛔ The workspace deps must be BUILT first. packages/cli/tsconfig.json
      # declares `paths` for them, but those paths are dead: it inherits
      # `baseUrl: "."` from the root config, so `../core/src` resolves relative to
      # the repo root — outside the repo. Resolution falls through to node_modules
      # → `types: dist/index.d.ts`, absent until built. Without this step the
      # check reports a 174-diagnostic TS2307 cascade instead of the package's
      # own 24. ~3.6s combined; the guard exits 2 if it is skipped.
      - name: Build workspace deps for the cli typecheck
        run: |
          npm run build -w @kitelev/exocortex-core
          npm run build -w @kitelev/exocortex-services

      - name: No new type errors in packages/cli
        run: node scripts/check-cli-types.mjs

      # Issue #4084 — the OTHER half of the same hole. No tsconfig in the repo includes
      # packages/**/tests/**, so no standalone tsc run covers the 975 test files. This is a
      # STRICTER SUPERSET of what ts-jest checks, NOT a reproduction of it: main is green
      # today with all 2396 baselined diagnostics present, so a red here does not imply a
      # failing suite. What it uniquely covers: tests/component/** (Playwright CT — type-
      # checked by nothing), and tests importing a module that MOVED packages while still
      # passing green, because the import is type-only and ts-jest erases it without
      # resolving (the annotation silently degrades to `any`). Measured 2026-08-19:
      # 433 (file, code) pairs / 2396 diagnostics. Reuses the build step above.
      - name: No new type errors in test files
        run: node scripts/check-test-types.mjs

      # Test-quality audit 2026-06-22 (recommendation P4): ratchet guard against
      # low-value test anti-patterns (method-exists `.toBe("function")` asserts +
      # vacuous `toBeGreaterThanOrEqual(0)` length asserts). Fails if their count
      # exceeds the committed baseline — bans NEW occurrences while grandfathering
      # existing debt. See scripts/check-test-antipatterns.sh.
      - name: Guard test anti-patterns
        run: bash scripts/check-test-antipatterns.sh

      # Test-quality audit 2026-06-22 (recommendation P5.1): coverage-monotonic
      # ratchet. jest coverageThreshold.global metrics may only GROW; this fails
      # the lint job if any threshold drifts BELOW the high-water mark recorded
      # in scripts/coverage-thresholds-baseline.json. Lowering a baseline number
      # is the explicit, req-justified withdrawal (RFC 0003 everything-req-first).
      - name: Guard coverage-threshold monotonicity
        run: node scripts/check-coverage-monotonic.mjs

  docs-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check documentation links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".mlc-config.json"
          folder-path: "docs"

  docs-property-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate property names in docs
        run: node scripts/validate-docs-properties.js

  archgate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Archgate
        uses: actions/cache@v6
        with:
          path: ~/.archgate
          key: archgate-${{ runner.os }}

      - name: Install Archgate
        # PINNED — never a bare `npm install -g archgate` (an unpinned CI tool
        # silently drifts: archgate 0.49.0/0.50.0 tightened the rule-file import
        # security scanner to allow only node:* imports, which broke every run
        # repo-wide, #3915). The rule files were adapted to the stricter policy
        # (MOBILE-004 inlined its detection helper, #3914), so we now pin the
        # current 0.50.0. Bump this pin deliberately after re-verifying archgate
        # green under the new version — do NOT un-pin.
        run: npm install -g archgate@0.50.0

      - name: Run ADR compliance checks
        run: archgate check --ci

  # RFC 0003 (requirements management) — traceability checker.
  #
  # Currently runs in SOFT mode (`REQ_GATE: soft` + `continue-on-error` on the
  # audit step + NOT in branch-protection required checks), so a red report can
  # never block a merge during the P1/P2 ramp (RFC 0003 §3.7). It clones the
  # public reqs assetspaces, runs the `requirements-audit` tool against the
  # repo's test corpus, and surfaces the report — coverage, P0 checklist,
  # ramp-readiness — as a step-summary + sticky PR comment (the "read-surface
  # carrot"). It is the home of the diff-aware traceability checks (archgate has
  # no vault-graph access).
  #
  # P3 HARD-GATE FLIP (RFC 0003 §3.7 + Alpha-GA decision = M3-closure
  # `1ec7677e`). The mechanism is built (this job + the `--gate` flag); the flip
  # is a deliberate, deterministic, one-action CI-config change performed AT
  # M3-closure — NOT auto-magic. To flip:
  #   1. set `REQ_GATE: hard` below (the audit then exits 1 when the P0 checklist
  #      is not ramp-ready — every enumerated P0 requirement bound + floor-met);
  #   2. delete `continue-on-error: true` on the "Run traceability audit" step;
  #   3. add `requirements-trace` to branch-protection required status checks.
  # Surface readiness BEFORE flipping: the report's `rampReady` field (shown in
  # the PR comment) must already be `true` on main.
  #
  # SOFT-GATE EXPIRY (RFC 0003 §3.7): the gate MUST flip hard at M3-closure.
  # Staying soft past M3-closure is permitted only with an explicit, documented
  # user dispensation — the gate is not allowed to silently remain advisory.
  #
  # TOOL (RFC 7c7859d1 W-req, migration-first): the checker is `packages/req-audit`
  # — repo-internal dev tooling, NOT a verb of the published `@kitelev/exocortex-cli`
  # (it was `exocortex requirements audit` until the extraction). It is
  # self-contained (no core/services/CLI build in this job) and runs straight from
  # source via `tsx`.
  requirements-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    env:
      # Single source of truth for the soft→hard flip. Flip to `hard` at
      # M3-closure (see the block above). `soft` = warn only; `hard` = also
      # block when the P0 checklist is not ramp-ready.
      REQ_GATE: soft
      # The reqs assetspaces this job's corpus consists of — the SINGLE
      # enumeration, driving BOTH the clone loop below AND the audit's corpus
      # floor (`--expect`). Adding a module = one name here, nowhere else: the
      # set the floor requires is definitionally the set CI clones, so the two
      # cannot drift apart (issue #4066).
      REQS_ASSETSPACES: exoas-exo-reqs,exoas-ems-reqs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      # The checker's own suites (moved with it out of packages/cli). They are
      # NOT covered by any test-coverage-* job, so they are gated here — the job
      # that owns the tool. A red suite fails this job, which reds the CI
      # workflow_run and therefore blocks Auto Release.
      - name: Test the requirements-audit tool
        run: |
          node --experimental-vm-modules ./node_modules/jest/bin/jest.js \
            --config packages/req-audit/jest.config.js

      - name: Clone reqs assetspaces (public)
        # The audit walks `$RUNNER_TEMP/reqs` recursively, so each per-module
        # reqs assetspace (RFC 0003 §3.2) is one more name in REQS_ASSETSPACES —
        # ⛔ do NOT add a clone line here, and do NOT repeat the name anywhere
        # else in this job: that env var is what the corpus floor requires.
        run: |
          mkdir -p "$RUNNER_TEMP/reqs"
          for name in ${REQS_ASSETSPACES//,/ }; do
            git clone --depth 1 \
              "https://github.com/kitelev/$name.git" \
              "$RUNNER_TEMP/reqs/$name"
          done

      - name: Run traceability audit (soft — never blocks until the P3 flip)
        id: audit
        # ⛔ Remove this `continue-on-error` line at the P3 M3-closure flip so a
        # hard finding (REQ_GATE=hard) blocks the merge.
        continue-on-error: true
        run: |
          # The JSON run is the AUTHORITATIVE gate signal — capture its exit code
          # directly (a `| tee` would mask it behind tee's 0). `exit $rc` at the
          # end makes the step's verdict the gate's verdict, so the M3-closure
          # flip (drop continue-on-error) blocks robustly regardless of the
          # human-readable run.
          rc=0
          npx tsx packages/req-audit/src/cli.ts \
            --reqs "$RUNNER_TEMP/reqs" --tests . --gate "$REQ_GATE" --output json \
            --expect "$REQS_ASSETSPACES" \
            > "$RUNNER_TEMP/req-report.json" || rc=$?
          cat "$RUNNER_TEMP/req-report.json"
          echo "--- human-readable (gate=$REQ_GATE) ---"
          npx tsx packages/req-audit/src/cli.ts \
            --reqs "$RUNNER_TEMP/reqs" --tests . --gate "$REQ_GATE" --output text \
            --expect "$REQS_ASSETSPACES" || true
          exit $rc

      - name: Active-requirement gate (BLOCKING — SDD feature-lifecycle invariant)
        if: always()
        # ⛔ NO continue-on-error. This is the ALWAYS-ON invariant (Andrey,
        # 2026-06-21): an `active` requirement MUST carry a verification binding,
        # else CI is red. ⛔ "Vacuous while zero requirements are `active`" — NO
        # LONGER TRUE: zero active requirements is now an INPUT-integrity failure
        # (req 99e06488-2da6-48fe-bd64-30c1e20bca0f), not a vacuous pass. Arms
        # per-requirement the moment one is flipped to `active`. The bound test
        # being GREEN is enforced by the test suite itself (the bound test runs
        # in CI); THIS step enforces the binding EXISTS (anti-orphan/dangling for
        # the active subset). Independent of the soft→hard P0 ramp (REQ_GATE).
        # The only way to make CI green without fixing the code is an explicit
        # move of the requirement to Deprecated (a conscious withdrawal).
        run: |
          node -e '
            const fs = require("fs");
            let r;
            try {
              r = JSON.parse(
                fs.readFileSync(process.env.RUNNER_TEMP + "/req-report.json", "utf8"),
              );
            } catch (e) {
              console.error(
                "Active-gate: no traceability report produced (checker failed to run) — failing closed.",
              );
              process.exit(1);
            }
            // Population floor FIRST (req 99e06488-2da6-48fe-bd64-30c1e20bca0f):
            // `activeViolations` is necessarily empty when the corpus never
            // arrived, so checking it first would print "OK" on a broken input.
            // A requirement is detected purely by the PRESENCE of a
            // `req__Requirement_status` predicate — so a renamed predicate, a
            // reqs assetspace moved elsewhere, or a failed clone turn THIS
            // blocking gate GREEN. The reason string is produced by the audit
            // (production-owned + unit-tested), printed verbatim here.
            if (!("inputIntegrityViolation" in r)) {
              console.error(
                "Active-gate: the report carries no `inputIntegrityViolation` field — " +
                  "it predates the population floor, so the floor was NOT evaluated. " +
                  "Failing closed rather than silently reverting to the pre-floor behaviour.",
              );
              process.exit(1);
            }
            if (r.inputIntegrityViolation) {
              console.error(
                "❌ Active-gate INPUT integrity failure — " +
                  r.inputIntegrityViolation,
              );
              console.error(
                "Fix: restore the requirements corpus (the `req__Requirement_status` " +
                  "predicate + the `exoas-*-reqs` clones in the step above), OR — if every " +
                  "requirement really was withdrawn — retire this gate deliberately.",
              );
              process.exit(1);
            }
            const v = r.activeViolations || [];
            if (v.length > 0) {
              console.error(
                "❌ Active-requirement invariant violated (" + v.length +
                  "): an active requirement has no verification binding.",
              );
              for (const a of v) {
                console.error("  " + a.uid + "  " + a.label + "\n    → " + a.reason);
              }
              console.error(
                "Fix: add a revert-verified @req binding, OR move the requirement to Deprecated.",
              );
              process.exit(1);
            }
            console.log(
              "✅ Active-gate OK — " + (r.activeTotal || 0) +
                " active requirement(s), all bound.",
            );
          '

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Requirements traceability (RFC 0003 — gate: ${REQ_GATE})"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/req-report.json" 2>/dev/null || echo '{ "error": "no report produced" }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post / update PR comment (best-effort)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- requirements-trace -->';
            let report = null;
            try {
              report = JSON.parse(
                fs.readFileSync(process.env.RUNNER_TEMP + '/req-report.json', 'utf8'),
              );
            } catch (e) {
              report = null;
            }
            const fmt = (r) => {
              if (!r) {
                return 'No traceability report was produced (checker failed to run).';
              }
              const pct = (r.coverage * 100).toFixed(1);
              const gate = r.gate ?? 'soft';
              const lines = [
                `**Requirements:** ${r.requirementCount} · **bound:** ${r.bound} · **coverage:** ${pct}% · **tags:** ${r.tagCount}`,
                `**P0 checklist:** ${r.p0Bound}/${r.p0Total} bound · **ramp-ready:** ${r.rampReady ? '✅ yes' : '❌ no'} · **gate:** \`${gate}\``,
                '',
                '| finding | count |',
                '| --- | --- |',
                `| orphan requirements (no \`@req\` binding) | ${r.orphans.length} |`,
                `| P0 requirements unbound (blocks the ramp) | ${r.p0Orphans} |`,
                `| dangling \`@req\` tags (no requirement) | ${r.dangling.length} |`,
                `| duplicate bindings | ${r.duplicates.length} |`,
                `| P0 binding-class floor violations | ${r.floorViolations.length} |`,
              ];
              if (r.dangling.length) {
                lines.push('', '**Dangling tags:**');
                for (const d of r.dangling) lines.push(`- \`@req:${d.uid}\` ${d.file}:${d.line}`);
              }
              if (r.floorViolations.length) {
                lines.push('', '**Floor violations (P0 bound solely to unit):**');
                for (const f of r.floorViolations) {
                  lines.push(`- \`${f.uid}\` [${f.bindingClasses.join(', ')}] ${f.label}`);
                }
              }
              const hardFindings = !r.clean;
              const wouldBlockHard = hardFindings || !r.rampReady;
              if (hardFindings) {
                lines.push(
                  '',
                  gate === 'hard'
                    ? '❌ hard findings present — **HARD gate, blocking**'
                    : '⚠️ hard findings present — **soft gate, non-blocking**',
                );
              } else if (!r.rampReady) {
                lines.push(
                  '',
                  gate === 'hard'
                    ? `❌ P0 checklist not ramp-ready (${r.p0Orphans} unbound) — **HARD gate, blocking**`
                    : `⚠️ P0 checklist not ramp-ready (${r.p0Orphans} unbound) — would block once flipped hard`,
                );
              } else {
                lines.push('', '✅ ramp-ready — clean + every P0 requirement bound');
              }
              if (gate === 'soft') {
                lines.push(
                  '',
                  wouldBlockHard
                    ? '> 🔴 **This PR would FAIL the P3 hard gate** (see above).'
                    : '> 🟢 Ready for the P3 hard flip (clean + ramp-ready).',
                );
              }
              return lines.join('\n');
            };
            const gateLabel = (report && report.gate) === 'hard' ? 'P3 — HARD' : 'P1/P2 — soft';
            const body =
              `${marker}\n## 🧭 Requirements traceability (RFC 0003 · ${gateLabel})\n\n` +
              `${fmt(report)}\n\n` +
              `<sub>Soft until the P3 flip at Alpha-GA / M3-closure (RFC 0003 §3.7). The \`rampReady\` field shows when it is safe to flip.</sub>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const existing = comments.data.find(
              (c) => c.body && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  # UI / integration tests (jest-environment-obsidian) — the tests/ui suite
  # (ActionButtonsLayout + UniversalLayoutRenderer, ~53 cases). This is the
  # SOLE CI runner of jest.ui.config.js: the test-coverage jest.config.js
  # explicitly excludes /tests/ui/, so this suite runs nowhere else.
  # Non-required by branch protection; promoting it to a required gate is a
  # separate branch-protection decision (audit epic #3384).
  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache-key-extra: "playwright-jammy"

      - name: Run UI tests (jest-environment-obsidian)
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run test:ui

  # Phase 2 CI speedup (task 9346c5be, 2026-04-21):
  # test-coverage was previously a single 190s job running three jest invocations
  # serially (obsidian-plugin full suite + CLI + exocortex regression).
  # Split into parallel matrix (obsidian-plugin 1/6..6/6) + sibling jobs (CLI,
  # exocortex-regression), with the branch-protected `test-coverage` name
  # repurposed as the aggregator (mirrors the e2e-shard → e2e-tests pattern).
  # Per-shard coverage-final.json is merged via scripts/merge-coverage.js.
  test-coverage-shard:
    # Runs on bare ubuntu-latest — jest uses jsdom testEnvironment, no browser
    # or Playwright binaries are needed. Skipping the playwright container
    # saves ~25s of container init per shard leg.
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Run obsidian-plugin tests (shard ${{ matrix.shard }}/6)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI: "true"
        run: |
          # Empty --coverageThreshold overrides jest.config.js thresholds so a
          # partial shard doesn't falsely fail the gate; aggregator applies
          # thresholds on merged coverage.
          node ./node_modules/jest/bin/jest.js \
            --config packages/obsidian-plugin/jest.config.js \
            --shard=${{ matrix.shard }}/6 \
            --coverage \
            --coverageReporters=json \
            --coverageReporters=lcov \
            --coverageThreshold='{}' \
            --maxWorkers=2 \
            --forceExit

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: packages/obsidian-plugin/coverage/coverage-final.json
          retention-days: 1
          if-no-files-found: error

  test-coverage-cli:
    # Bare ubuntu-latest — CLI jest is node-only; no browser/playwright needed.
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Run CLI tests with coverage
        env:
          NODE_OPTIONS: "--max-old-space-size=4096 --experimental-vm-modules"
          CI: "true"
        run: |
          node --experimental-vm-modules ./node_modules/jest/bin/jest.js \
            --config packages/cli/jest.config.js \
            --coverage \
            --coverageReporters=lcov \
            --coverageReporters=json-summary \
            --coverageReporters=text-summary \
            --forceExit

      - name: Check coverage thresholds (cli)
        run: |
          echo "=============================================="
          echo "Verifying CLI package coverage thresholds"
          echo "=============================================="

          CLI_COVERAGE_FILE="packages/cli/coverage/coverage-summary.json"
          if [ ! -f "$CLI_COVERAGE_FILE" ]; then
            echo "⚠️ CLI coverage report not found at $CLI_COVERAGE_FILE"
            echo "CLI coverage collection may not be enabled."
            exit 0
          fi

          STATEMENTS=$(cat "$CLI_COVERAGE_FILE" | jq -r '.total.statements.pct')
          BRANCHES=$(cat "$CLI_COVERAGE_FILE" | jq -r '.total.branches.pct')
          FUNCTIONS=$(cat "$CLI_COVERAGE_FILE" | jq -r '.total.functions.pct')
          LINES=$(cat "$CLI_COVERAGE_FILE" | jq -r '.total.lines.pct')

          echo "📊 CLI Coverage Report:"
          echo "  Statements: ${STATEMENTS}% (required: 65%)"
          echo "  Branches:   ${BRANCHES}% (required: 60%)"
          echo "  Functions:  ${FUNCTIONS}% (required: 70%)"
          echo "  Lines:      ${LINES}% (required: 65%)"

          FAILED=0
          if [ $(echo "$STATEMENTS < 65" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ CLI Statement coverage ${STATEMENTS}% is below 65% threshold"
            FAILED=1
          fi

          if [ $(echo "$BRANCHES < 60" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ CLI Branch coverage ${BRANCHES}% is below 60% threshold"
            FAILED=1
          fi

          if [ $(echo "$FUNCTIONS < 70" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ CLI Function coverage ${FUNCTIONS}% is below 70% threshold"
            FAILED=1
          fi

          if [ $(echo "$LINES < 65" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ CLI Line coverage ${LINES}% is below 65% threshold"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi

          echo "✅ CLI coverage thresholds met!"

      - name: Upload CLI coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cli
          path: packages/cli/coverage/
          retention-days: 1
          if-no-files-found: ignore

  parity-gate:
    # RFC `94e520da` Phase 3 (T3.3) — required CI gate enforcing CLI ↔ plugin
    # triple parity (М2: diff = 0 across 5 reference vaults). Runs ONLY the
    # parity integration test in isolation so a failure surfaces with a
    # named, dedicated check rather than being absorbed into the broader
    # `test-coverage-cli` job. Independently parallel; not part of the
    # `test-coverage` aggregator chain by design.
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Run CLI ↔ plugin triple parity diff-test
        env:
          NODE_OPTIONS: "--max-old-space-size=4096 --experimental-vm-modules"
          CI: "true"
        run: |
          node --experimental-vm-modules ./node_modules/jest/bin/jest.js \
            --config packages/cli/jest.config.js \
            --testPathPatterns='tests/integration/cli-plugin-triple-parity\.integration\.test\.ts' \
            --runInBand \
            --forceExit

  test-coverage-exocortex:
    # Bare ubuntu-latest — node-only core suite, no browser needed. Runs the
    # FULL packages/core/jest.config.js (all ~319 suites), not an allow-list.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Run exocortex core test suite (full)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI: "true"
        # TF-gate (project "Exocortex Alpha Launch", O1+O2): run the FULL
        # packages/core/jest.config.js instead of an inline allow-list.
        #
        # The previous `--testPathPatterns` allow-list gated only ~55 of the
        # ~319 core suites, leaving ~83% of the SPARQL/RDF/grounding engine
        # untested in CI (a regression in any ungated suite reached main
        # silently — see Issue #3189, #3506). Worse, the allow-list was a
        # maintenance trap: every new exocortex test had to be hand-added or it
        # rotted in zero CI jobs.
        #
        # Dropping the pattern runs every suite under jest.config.js `roots`
        # (`<rootDir>/tests`). `submodules: recursive` (above) provides
        # packages/exoas-exocmd for the grounding-type vault-fixture-parity
        # suite. No `--coverage` here — this job is a pass/fail gate; coverage
        # thresholds are enforced by the shard/cli jobs feeding `test-coverage`.
        #
        # tests/performance/** is EXCLUDED from this hard gate: those suites are
        # wall-clock micro-benchmarks with tight ms thresholds (some <0.1ms) that
        # flake under the parallel-jest-worker contention of a shared CI runner
        # (empirically MultiHop/TripleStore/Combined spiked 1.3-2x over their
        # local times). Gating them would intermittently red the whole pipeline.
        # The non-perf core-logic suites (SPARQL/RDF/grounding/contracts/domain)
        # — the actual coverage gap O1 closes — are all still gated. Recalibrating
        # the perf thresholds for a (non-blocking) perf job is a separate follow-up.
        run: |
          node ./node_modules/jest/bin/jest.js \
            --config packages/core/jest.config.js \
            --testPathIgnorePatterns '/node_modules/' '/tests/performance/' \
            --forceExit

  test-coverage:
    # Bare ubuntu-latest aggregator — only runs istanbul merge + threshold
    # checks in pure Node. jq is preinstalled on ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [test-coverage-shard, test-coverage-cli, test-coverage-exocortex]
    if: always()

    steps:
      - name: Verify upstream jobs succeeded
        run: |
          if [ "${{ needs.test-coverage-shard.result }}" != "success" ]; then
            echo "❌ test-coverage-shard failed"
            exit 1
          fi
          if [ "${{ needs.test-coverage-cli.result }}" != "success" ]; then
            echo "❌ test-coverage-cli failed"
            exit 1
          fi
          if [ "${{ needs.test-coverage-exocortex.result }}" != "success" ]; then
            echo "❌ test-coverage-exocortex failed"
            exit 1
          fi
          echo "✅ All upstream coverage jobs passed"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Download obsidian-plugin shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      - name: Merge obsidian-plugin coverage
        run: |
          mkdir -p packages/obsidian-plugin/coverage
          node scripts/merge-coverage.js coverage-shards packages/obsidian-plugin/coverage

      - name: Check coverage thresholds (obsidian-plugin)
        run: |
          echo "=============================================="
          echo "Verifying obsidian-plugin coverage thresholds"
          echo "=============================================="

          COVERAGE_FILE="packages/obsidian-plugin/coverage/coverage-summary.json"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ Coverage report not found at $COVERAGE_FILE"
            echo "The merge step did not produce a summary."
            exit 1
          fi

          STATEMENTS=$(cat "$COVERAGE_FILE" | jq -r '.total.statements.pct')
          BRANCHES=$(cat "$COVERAGE_FILE" | jq -r '.total.branches.pct')
          FUNCTIONS=$(cat "$COVERAGE_FILE" | jq -r '.total.functions.pct')
          LINES=$(cat "$COVERAGE_FILE" | jq -r '.total.lines.pct')

          echo "📊 obsidian-plugin Coverage Report (merged across shards):"
          echo "  Statements: ${STATEMENTS}% (required: 75.5%)"
          echo "  Branches:   ${BRANCHES}% (required: 63%)"
          echo "  Functions:  ${FUNCTIONS}% (required: 69%)"
          echo "  Lines:      ${LINES}% (required: 76%)"

          FAILED=0
          if [ $(echo "$STATEMENTS < 75.5" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ Statement coverage ${STATEMENTS}% is below 75.5% threshold"
            FAILED=1
          fi

          if [ $(echo "$BRANCHES < 63" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ Branch coverage ${BRANCHES}% is below 63% threshold"
            FAILED=1
          fi

          if [ $(echo "$FUNCTIONS < 69" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ Function coverage ${FUNCTIONS}% is below 69% threshold"
            FAILED=1
          fi

          if [ $(echo "$LINES < 76" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ Line coverage ${LINES}% is below 76% threshold"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi

          echo "✅ obsidian-plugin coverage thresholds met!"

      - name: Generate coverage summary
        if: always()
        run: |
          COVERAGE_DIR="packages/obsidian-plugin/coverage"
          if [ -f "$COVERAGE_DIR/lcov.info" ]; then
            echo "## Code Coverage Report" > coverage-summary.md
            echo "" >> coverage-summary.md
            cat "$COVERAGE_DIR/lcov-report/index.html" | grep -A 5 "class='fraction'" | head -20 >> coverage-summary.md || true
            echo "" >> coverage-summary.md
            echo "Full report available in coverage artifacts" >> coverage-summary.md
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            packages/obsidian-plugin/coverage/
            coverage-summary.md
          retention-days: 30
          if-no-files-found: ignore

  test-component:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    # Skip on docs-only PRs (no packages/ or spec/test changes). Push events
    # and force-e2e-labelled PRs always run. Skipped required checks are
    # treated as passing by GitHub branch protection.
    if: >-
      github.event_name == 'push' ||
      needs.detect-changes.outputs.code == 'true' ||
      needs.detect-changes.outputs.force == 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps (+ build)
        uses: ./.github/actions/setup-node-pnpm
        with:
          run-build: "true"
          cache-key-extra: "playwright-jammy"

      - name: Run component tests (excluding visual)
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          # Run component tests excluding visual regression tests
          # Visual tests run separately with --update-snapshots for CI
          npx playwright test -c packages/obsidian-plugin/playwright-ct.config.ts --grep-invert visual

      # Issue #3464 — iPhone mobile-load E2E smoke. Module-evals the BUILT
      # plugin bundle (produced by setup-node-pnpm run-build above) inside a
      # real WebKit engine with iPhone emulation and a require-shim that
      # throws on Node builtins — the closest CI-feasible reproduction of the
      # Obsidian iOS load path (the closed-source iOS app cannot run in CI).
      # Catches the v16.51.0 regression class: top-level `import ... from
      # "node:*"` in plugin src → module-eval require → plugin fails to load
      # on iOS. Empirically verified revert→fail / restore→pass.
      - name: iPhone mobile-load smoke (WebKit, Issue #3464)
        run: npx playwright test -c packages/obsidian-plugin/playwright-mobile-smoke.config.ts

      - name: Run visual regression tests (update snapshots if missing)
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          # Check if Linux snapshots exist, if not generate them
          if ! ls packages/obsidian-plugin/tests/component/__snapshots__/**/*-linux.png 2>/dev/null | head -1; then
            echo "Linux snapshots not found, generating baseline snapshots..."
            npx playwright test -c packages/obsidian-plugin/playwright-ct.config.ts --grep visual --update-snapshots || true
          else
            echo "Running visual regression tests against existing snapshots..."
            npx playwright test -c packages/obsidian-plugin/playwright-ct.config.ts --grep visual
          fi
        continue-on-error: true

      - name: Upload component test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: component-test-report
          path: playwright-report-ct/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload component test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: component-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: |
            packages/obsidian-plugin/tests/component/__snapshots__/**/*-diff.png
            packages/obsidian-plugin/tests/component/__snapshots__/**/*-actual.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Linux baseline snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-visual-snapshots
          path: packages/obsidian-plugin/tests/component/__snapshots__/**/*-linux.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Track Flaky Tests (Component)
        if: always()
        run: |
          cd packages/obsidian-plugin
          # Check if flaky report was generated
          if [ -f "flaky-report-playwright.json" ]; then
            echo "📊 Playwright Flaky Test Report Generated"
            cat flaky-report-playwright.json

            # Check if any flaky tests were detected
            FLAKY_COUNT=$(cat flaky-report-playwright.json | grep -o '"totalFlaky":[0-9]*' | grep -o '[0-9]*' || echo "0")
            if [ "$FLAKY_COUNT" -gt 0 ]; then
              echo ""
              echo "⚠️ WARNING: $FLAKY_COUNT flaky component test(s) detected!"
              echo "Flaky tests indicate race conditions or timing issues."
              echo "Please investigate and fix these tests."
            fi
          else
            echo "No flaky report generated (no retries occurred)"
          fi

      - name: Upload Flaky Test Report (Component)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-test-report-component
          path: packages/obsidian-plugin/flaky-report-playwright.json
          retention-days: 30
          if-no-files-found: ignore

  # E2E tests with sharding for faster execution
  # Target: 5 minutes (down from 15 minutes)
  # Note: Named e2e-shard-* to avoid conflict with branch protection rule for "e2e-tests"
  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, detect-changes]
    # NOTE: no job-level `if:` here — matrix-job skip collapses to a single
    # base `e2e-shard` check-run, dropping the branch-protected parenthesised
    # `e2e-shard (1..6)` required check names. Instead, the job always starts,
    # then each step is gated on `env.RUN_E2E`. On docs-only PRs the runner
    # exits in ~15-30s after skipping every heavy step, registering an
    # individual `e2e-shard (N)` check-run with conclusion `success` — which
    # satisfies branch protection.
    env:
      RUN_E2E: ${{ github.event_name == 'push' || needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.force == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Announce gating decision
        run: |
          echo "RUN_E2E=${RUN_E2E}"
          if [ "$RUN_E2E" = "true" ]; then
            echo "::notice::Running e2e shard ${{ matrix.shard }}/6 (code change detected)"
          else
            echo "::notice::Skipping e2e shard ${{ matrix.shard }}/6 (docs-only PR — detect-changes gate)"
          fi

      - name: Checkout
        if: env.RUN_E2E == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download built plugin
        if: env.RUN_E2E == 'true'
        uses: actions/download-artifact@v8
        with:
          name: plugin-build
          path: .

      # Phase 5 CI Speedup (task d7d18dd6): use the `docker` driver (local
      # Docker daemon) so that both the GHCR-pulled base image and the
      # locally-built fallback base are visible to the FROM in Dockerfile.e2e.
      # The default `docker-container` driver runs in an isolated namespace
      # and cannot resolve locally-tagged images at FROM-time.
      # Trade-off: loses BuildKit `type=gha` intermediate-layer caching for
      # the Dockerfile.e2e build; acceptable because that build is now a
      # thin app layer (~5s) once the heavy base is cache-hit via GHCR.
      - name: Set up Docker Buildx
        if: env.RUN_E2E == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # Phase 5: pull pre-built base image from GHCR when possible. The
      # base contains xvfb + Obsidian + node_modules, so Dockerfile.e2e
      # only needs to COPY plugin artifacts (~5s instead of ~80s cold).
      - name: Log in to GHCR
        if: env.RUN_E2E == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base image (pull from GHCR or build locally)
        if: env.RUN_E2E == 'true'
        id: base
        run: |
          set -euo pipefail
          HASH=$(cat \
            package-lock.json \
            packages/obsidian-plugin/Dockerfile.ci \
            | sha256sum | cut -c1-16)
          TAGGED="ghcr.io/kitelev/exocortex-ci:${HASH}"
          LATEST="ghcr.io/kitelev/exocortex-ci:latest"

          # Prefer the exact-hash tag (deterministic). Fall back to :latest
          # which lags by one main-merge but still saves the npm ci cost.
          # Final fallback is a local Dockerfile.ci build (bootstrap / first
          # run on a new lock file; adds ~60s but preserves correctness).
          if docker pull "$TAGGED" 2>/dev/null; then
            echo "::notice::Pulled pre-built base $TAGGED (hash match)"
            echo "image=$TAGGED" >> "$GITHUB_OUTPUT"
          elif docker pull "$LATEST" 2>/dev/null; then
            echo "::warning::Hash-tagged base $TAGGED not in GHCR — using $LATEST (lock file may have changed; speedup still partial)"
            echo "image=$LATEST" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No pre-built base in GHCR — building locally from Dockerfile.ci (bootstrap / cache cold)"
            docker build \
              -t exocortex-ci-base:local \
              -f packages/obsidian-plugin/Dockerfile.ci \
              .
            echo "image=exocortex-ci-base:local" >> "$GITHUB_OUTPUT"
          fi

      - name: Build E2E Docker image
        if: env.RUN_E2E == 'true'
        # With the `docker` driver (see setup-buildx step above) the legacy
        # builder is used, which does not support type=gha registry cache.
        # That's acceptable here because the Dockerfile.e2e build is now a
        # thin app layer (~5s); heavy caching happens at the base-image
        # level in GHCR instead.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/obsidian-plugin/Dockerfile.e2e
          load: true
          tags: exocortex-e2e:latest
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}

      # D1 CI Path 2 (task e0f6e6fd): per-shard weighted configs replace
      # Playwright's default `--shard=N/M` split. Each playwright.shard-N.config.ts
      # extends playwright-e2e.config.ts and sets an explicit testMatch drawn
      # from packages/obsidian-plugin/playwright-shard-assignments.json — LPT
      # bin-packed by Phase 2a per-spec median timing (asset 473184ea) so that
      # max-minus-min shard variance stays ≤15s. The lint job runs
      # scripts/validate-shard-assignments.mjs to guard against drift when
      # new *.spec.ts files land.
      - name: Run E2E tests (shard ${{ matrix.shard }}/6)
        if: env.RUN_E2E == 'true'
        run: |
          mkdir -p test-results-e2e playwright-report-e2e blob-report plugin-wait-ms
          docker run --init --rm \
            -v $PWD/test-results-e2e:/app/test-results \
            -v $PWD/playwright-report-e2e:/app/playwright-report-e2e \
            -v $PWD/blob-report:/app/packages/obsidian-plugin/blob-report \
            -v $PWD/plugin-wait-ms:/app/plugin-wait-ms \
            -e CI=true \
            -e SHARD_LABEL=${{ matrix.shard }} \
            -e PLUGIN_WAIT_MS_LOG=/app/plugin-wait-ms/shard-${{ matrix.shard }}.jsonl \
            -e FIXTURE_DRIFT_OUTPUT=/app/test-results/fixture-drift.json \
            exocortex-e2e npx playwright test -c packages/obsidian-plugin/playwright.shard-${{ matrix.shard }}.config.ts

      # RFC Phase 3 / T2.2 — surface per-shard retry count to job summary.
      # Reporter writes retry-summary.{md,json} inside the container at
      # /app/test-results, which is mounted to ./test-results-e2e on the host.
      # We always run this step so the summary is visible even when the test
      # step failed (retries exhausted).
      - name: Append retry summary to job summary (shard ${{ matrix.shard }})
        if: always() && env.RUN_E2E == 'true'
        run: |
          SUMMARY="test-results-e2e/retry-summary.md"
          if [ -f "$SUMMARY" ]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No retry-summary.md emitted by shard ${{ matrix.shard }} (reporter did not run)._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload retry-summary JSON for shard ${{ matrix.shard }}
        if: always() && env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: retry-summary-shard-${{ matrix.shard }}
          path: test-results-e2e/retry-summary.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload blob report for shard ${{ matrix.shard }}
        if: always() && env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload E2E test artifacts (videos, screenshots, traces) for shard ${{ matrix.shard }}
        if: always() && env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-artifacts-${{ matrix.shard }}
          path: test-results-e2e/
          retention-days: 7
          if-no-files-found: ignore

      # RFC 3cc77ba2 v2 §Phase 1.2: PLUGIN_WAIT_MS observability. Helper
      # `tests/e2e/utils/waitForExocortexPlugin.ts` writes per-invocation
      # timings as JSONL when `PLUGIN_WAIT_MS_LOG` is set. We upload the
      # artifact unconditionally and then run a post-hoc P99 gate
      # (fail when P99 > 15000 ms) per shard. Empty log is benign: the
      # gate only fires on observed samples.
      - name: Upload PLUGIN_WAIT_MS log for shard ${{ matrix.shard }}
        if: always() && env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-wait-ms-shard-${{ matrix.shard }}
          path: plugin-wait-ms/shard-${{ matrix.shard }}.jsonl
          retention-days: 30
          if-no-files-found: ignore

      - name: Enforce PLUGIN_WAIT_MS P99 gate (shard ${{ matrix.shard }})
        if: always() && env.RUN_E2E == 'true'
        run: |
          LOG="plugin-wait-ms/shard-${{ matrix.shard }}.jsonl"
          if [ ! -s "$LOG" ]; then
            echo "::notice::No PLUGIN_WAIT_MS samples for shard ${{ matrix.shard }} — gate skipped"
            exit 0
          fi
          # Compute P99 across samples; for N<100 we floor to index
          # `floor(N * 0.99)` which is functionally the max for small N.
          P99=$(jq -s '
            map(.ms) | sort_by(.) as $xs |
            if length == 0 then 0
            else $xs[(length - 1) | floor | if . < 0 then 0 else . end]
            end' "$LOG" | head -1)
          N=$(wc -l < "$LOG" | tr -d ' ')
          echo "::notice::shard=${{ matrix.shard }} N=$N P99_PLUGIN_WAIT_MS=${P99}ms (gate: ≤15000)"
          if [ -z "$P99" ] || [ "$P99" = "null" ]; then
            echo "::warning::Unable to compute P99 (N=$N) — gate skipped"
            exit 0
          fi
          if [ "$P99" -gt 15000 ]; then
            echo "::error::P99 PLUGIN_WAIT_MS=${P99}ms exceeds 15000ms gate on shard ${{ matrix.shard }} (N=$N samples)"
            exit 1
          fi
          echo "✅ P99 PLUGIN_WAIT_MS gate passed: ${P99}ms ≤ 15000ms"

  # Merge E2E test reports from all shards
  # Named "e2e-tests" to satisfy branch protection rule
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [e2e-shard, detect-changes]
    if: always()
    env:
      RUN_E2E: ${{ github.event_name == 'push' || needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.force == 'true' }}

    steps:
      - name: Check shard results
        run: |
          # needs.e2e-shard.result: 'success' | 'failure' | 'skipped' | 'cancelled'
          # On docs-only PRs each shard finishes quickly with 'success' after
          # the inner-step-skip gate, so 'success' covers both real-pass and
          # no-op-pass. Only 'failure' / 'cancelled' block the aggregator.
          RESULT="${{ needs.e2e-shard.result }}"
          case "$RESULT" in
            success)
              if [ "$RUN_E2E" = "true" ]; then
                echo "✅ All E2E shards passed"
              else
                echo "✅ E2E shards no-op-passed (docs-only PR — detect-changes gate)"
              fi
              ;;
            skipped)
              echo "✅ E2E shards skipped (upstream job-level skip)"
              ;;
            *)
              echo "❌ E2E shards reported result: $RESULT"
              exit 1
              ;;
          esac

      - name: Checkout
        if: env.RUN_E2E == 'true'
        uses: actions/checkout@v6

      # Phase 3 exit gate (task 574476fc 2026-04-22):
      # Aggregator previously ran `actions/setup-node@v4` + `npm install -D
      # @playwright/test` (~18s). Replaced with the cached composite action
      # (`@playwright/test` is already a root devDependency, version-locked
      # via package-lock.json). Cache-hit path is ~8-10s, saving ~8-10s on
      # the critical path.
      - name: Setup Node & install deps
        if: env.RUN_E2E == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Download all blob reports
        if: env.RUN_E2E == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Download all test artifacts (videos, screenshots, traces)
        if: env.RUN_E2E == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-test-artifacts-*
          path: all-test-artifacts
          merge-multiple: true

      - name: Merge E2E reports
        if: env.RUN_E2E == 'true'
        run: |
          npx playwright merge-reports --reporter html ./all-blob-reports
        continue-on-error: true

      # RFC Phase 3 / T2.2 — aggregate retry counts across shards into a
      # single PR-level "this PR's e2e was retried: <count>" annotation.
      - name: Download retry-summary artifacts
        if: always() && env.RUN_E2E == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: retry-summary-shard-*
          path: all-retry-summaries
          merge-multiple: false

      - name: Aggregate retry summary across shards
        if: always() && env.RUN_E2E == 'true'
        run: |
          set -euo pipefail
          ROOT="all-retry-summaries"
          if [ ! -d "$ROOT" ]; then
            echo "_No retry-summary artifacts downloaded._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -t FILES < <(find "$ROOT" -name retry-summary.json -print | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "_No retry-summary.json files found across shards._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TOTAL_TESTS=0
          TOTAL_RETRIES=0
          TOTAL_RETRIED_SPECS=0
          TOTAL_FLAKY_PASSED=0
          TOTAL_FAILED_AFTER_RETRY=0
          for f in "${FILES[@]}"; do
            T=$(jq -r '.totalTests // 0' "$f")
            R=$(jq -r '.totalRetries // 0' "$f")
            S=$(jq -r '(.entries // []) | length' "$f")
            FP=$(jq -r '.flakyPassed // 0' "$f")
            FA=$(jq -r '.failedAfterRetry // 0' "$f")
            TOTAL_TESTS=$((TOTAL_TESTS + T))
            TOTAL_RETRIES=$((TOTAL_RETRIES + R))
            TOTAL_RETRIED_SPECS=$((TOTAL_RETRIED_SPECS + S))
            TOTAL_FLAKY_PASSED=$((TOTAL_FLAKY_PASSED + FP))
            TOTAL_FAILED_AFTER_RETRY=$((TOTAL_FAILED_AFTER_RETRY + FA))
          done
          {
            echo ""
            echo "## E2E retry summary — aggregated across shards"
            echo ""
            echo "**This PR's e2e was retried: ${TOTAL_RETRIES} time(s) across ${TOTAL_RETRIED_SPECS} spec(s).**"
            echo ""
            echo "- Total tests executed: **${TOTAL_TESTS}**"
            echo "- Specs that retried at least once: **${TOTAL_RETRIED_SPECS}**"
            echo "- Total retries: **${TOTAL_RETRIES}**"
            echo "- Flaky-passed (passed after retry): **${TOTAL_FLAKY_PASSED}**"
            echo "- Failed after retry: **${TOTAL_FAILED_AFTER_RETRY}**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL_RETRIES" -gt 0 ]; then
            echo "::notice::E2E retry count for this run = ${TOTAL_RETRIES} (across ${TOTAL_RETRIED_SPECS} spec(s))"
          else
            echo "::notice::E2E retry count for this run = 0"
          fi

      - name: Upload merged E2E test report
        if: env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload merged test artifacts (videos, screenshots, traces)
        if: env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-artifacts
          path: all-test-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    # Skip on docs-only PRs — performance regression detection is only
    # meaningful when production code / perf benchmarks / deps change.
    if: >-
      github.event_name == 'push' ||
      needs.detect-changes.outputs.code == 'true' ||
      needs.detect-changes.outputs.force == 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps (+ build)
        uses: ./.github/actions/setup-node-pnpm
        with:
          run-build: "true"
          cache-key-extra: "playwright-jammy"

      - name: Run unit-level performance tests
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run test:perf

      - name: Run component rendering performance tests
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run test:perf:component
        continue-on-error: true

      - name: Generate Performance Report Summary
        if: always()
        run: |
          echo "## Performance Test Results" > performance-summary.md
          echo "" >> performance-summary.md
          echo "**Run Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> performance-summary.md
          echo "" >> performance-summary.md
          echo "### Test Categories" >> performance-summary.md
          echo "" >> performance-summary.md
          echo "| Category | Status |" >> performance-summary.md
          echo "|----------|--------|" >> performance-summary.md
          echo "| SPARQL Query Performance | ✅ |" >> performance-summary.md
          echo "| Triple Store Performance | ✅ |" >> performance-summary.md
          echo "| RDF Mapping Performance | ✅ |" >> performance-summary.md
          echo "| Rendering Helpers Performance | ✅ |" >> performance-summary.md
          echo "| Component Rendering Performance | ✅ |" >> performance-summary.md
          echo "" >> performance-summary.md
          echo "### Benchmark Targets" >> performance-summary.md
          echo "" >> performance-summary.md
          echo "| Operation | Target | Max Acceptable |" >> performance-summary.md
          echo "|-----------|--------|----------------|" >> performance-summary.md
          echo "| Simple SELECT (10k triples) | 100ms | 200ms |" >> performance-summary.md
          echo "| Complex JOIN | 500ms | 1000ms |" >> performance-summary.md
          echo "| FILTER with REGEX | 300ms | 600ms |" >> performance-summary.md
          echo "| Table render (100 rows) | 2000ms | 4000ms |" >> performance-summary.md
          echo "| Component re-render | 500ms | 1000ms |" >> performance-summary.md

      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-test-report
          path: performance-summary.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Component Performance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: component-performance-report
          path: playwright-report-ct/
          retention-days: 30
          if-no-files-found: ignore
