name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect whether PR touches code that requires e2e/browser testing.
  # Used to skip heavy jobs (e2e-shard, test-component, performance-tests)
  # on docs-only PRs. R4 mitigation: the `code` filter includes restrictive
  # globs for ANY *.spec.{ts,tsx,js,jsx} or *.test.{ts,tsx,js,jsx} change
  # anywhere in the tree, so a docs PR that inadvertently renames or adds
  # a spec file still triggers e2e (no false-green).
  #
  # Manual override: apply the `force-e2e` label to a PR to force e2e jobs
  # to run even if only docs/** changed (FORCE_E2E equivalent).
  #
  # Push events to main always run e2e (bypass gating via github.event_name).
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      code: ${{ steps.filter.outputs.code }}
      force: ${{ steps.force.outputs.force }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              # R4 mitigation: spec/test files anywhere trigger e2e even if
              # the rest of the diff is docs-only (catches inadvertent spec
              # rename / migration into docs/ or similar directories).
              - '**/*.spec.{ts,tsx,js,jsx}'
              - '**/*.test.{ts,tsx,js,jsx}'
              # Production code & config.
              - 'packages/**'
              - 'scripts/**'
              # CI infrastructure itself (workflows, composite actions,
              # Dockerfiles) must always trigger e2e so workflow changes
              # are validated end-to-end.
              - '.github/workflows/**'
              - '.github/actions/**'
              - '**/Dockerfile*'
              # Dependency & TS config changes that can affect runtime.
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '**/jest.config.*'
              - '**/playwright*.config.*'

      - name: Detect manual override (force-e2e label)
        id: force
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"force-e2e"'; then
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "::notice::FORCE_E2E override active (force-e2e label present)"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps (+ build)
        uses: ./.github/actions/setup-node-pnpm
        with:
          run-build: "true"

      - name: Upload built plugin
        uses: actions/upload-artifact@v6
        with:
          name: plugin-build
          path: |
            packages/obsidian-plugin/main.js
            packages/obsidian-plugin/manifest.json
          retention-days: 1

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Type check
        run: npm run check:types

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint
        run: npm run lint
        continue-on-error: true

  docs-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check documentation links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".mlc-config.json"
          folder-path: "docs"

  docs-property-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate property names in docs
        run: node scripts/validate-docs-properties.js

  archgate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Archgate
        uses: actions/cache@v4
        with:
          path: ~/.archgate
          key: archgate-${{ runner.os }}

      - name: Install Archgate
        run: npm install -g archgate

      - name: Run ADR compliance checks
        run: archgate check --ci

  # test-unit runs ONLY UI tests (jest-environment-obsidian).
  # Phase 2 (CI speedup, task 761ca21e 2026-04-21):
  #   Previously also ran test:unit (= test-ci-batched.sh) duplicating test-coverage.
  #   That duplicate jest invocation was removed here. test-coverage remains the
  #   single full-suite jest runner with --coverage.
  # Phase 4 (planned, task f235881d): drop this job after the main branch
  # protection rule is updated to no longer require "test-unit" as a status check.
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache-key-extra: "playwright-jammy"

      - name: Run UI tests (jest-environment-obsidian)
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run test:ui

      - name: Track Flaky Tests
        if: always()
        run: |
          # Check if flaky report was generated
          if [ -f "flaky-report.json" ]; then
            echo "📊 Flaky Test Report Generated"
            cat flaky-report.json

            # Check if any flaky tests were detected
            FLAKY_COUNT=$(cat flaky-report.json | grep -o '"totalFlaky":[0-9]*' | grep -o '[0-9]*' || echo "0")
            if [ "$FLAKY_COUNT" -gt 0 ]; then
              echo ""
              echo "⚠️ WARNING: $FLAKY_COUNT flaky test(s) detected!"
              echo "Flaky tests indicate race conditions or timing issues."
              echo "Please investigate and fix these tests."
            fi
          else
            echo "No flaky report generated (no retries occurred)"
          fi

      - name: Upload Flaky Test Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flaky-test-report-unit
          path: flaky-report.json
          retention-days: 30
          if-no-files-found: ignore

  # Phase 2 CI speedup (task 9346c5be, 2026-04-21):
  # test-coverage was previously a single 190s job running three jest invocations
  # serially (obsidian-plugin full suite + CLI + exocortex regression).
  # Split into parallel matrix (obsidian-plugin 1/4..4/4) + sibling jobs (CLI,
  # exocortex-regression), with the branch-protected `test-coverage` name
  # repurposed as the aggregator (mirrors the e2e-shard → e2e-tests pattern).
  # Per-shard coverage-final.json is merged via scripts/merge-coverage.js.
  test-coverage-shard:
    # Runs on bare ubuntu-latest — jest uses jsdom testEnvironment, no browser
    # or Playwright binaries are needed. Skipping the playwright container
    # saves ~25s of container init per shard leg.
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Run obsidian-plugin tests (shard ${{ matrix.shard }}/4)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI: "true"
          FLAKY_REPORT_FILE: "flaky-report-shard-${{ matrix.shard }}.json"
        run: |
          # Empty --coverageThreshold overrides jest.config.js thresholds so a
          # partial shard doesn't falsely fail the gate; aggregator applies
          # thresholds on merged coverage.
          node ./node_modules/jest/bin/jest.js \
            --config packages/obsidian-plugin/jest.config.js \
            --shard=${{ matrix.shard }}/4 \
            --coverage \
            --coverageReporters=json \
            --coverageReporters=lcov \
            --coverageThreshold='{}' \
            --maxWorkers=2 \
            --forceExit

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: packages/obsidian-plugin/coverage/coverage-final.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload shard flaky report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flaky-report-shard-${{ matrix.shard }}
          path: flaky-report-shard-${{ matrix.shard }}.json
          retention-days: 30
          if-no-files-found: ignore

  test-coverage-cli:
    # Bare ubuntu-latest — CLI jest is node-only; no browser/playwright needed.
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Run CLI tests with coverage
        env:
          NODE_OPTIONS: "--max-old-space-size=4096 --experimental-vm-modules"
          CI: "true"
        run: |
          node --experimental-vm-modules ./node_modules/jest/bin/jest.js \
            --config packages/cli/jest.config.js \
            --coverage \
            --coverageReporters=lcov \
            --coverageReporters=json-summary \
            --coverageReporters=text-summary \
            --forceExit

      - name: Check coverage thresholds (cli)
        run: |
          echo "=============================================="
          echo "Verifying CLI package coverage thresholds"
          echo "=============================================="

          CLI_COVERAGE_FILE="packages/cli/coverage/coverage-summary.json"
          if [ ! -f "$CLI_COVERAGE_FILE" ]; then
            echo "⚠️ CLI coverage report not found at $CLI_COVERAGE_FILE"
            echo "CLI coverage collection may not be enabled."
            exit 0
          fi

          STATEMENTS=$(cat "$CLI_COVERAGE_FILE" | jq -r '.total.statements.pct')
          BRANCHES=$(cat "$CLI_COVERAGE_FILE" | jq -r '.total.branches.pct')
          FUNCTIONS=$(cat "$CLI_COVERAGE_FILE" | jq -r '.total.functions.pct')
          LINES=$(cat "$CLI_COVERAGE_FILE" | jq -r '.total.lines.pct')

          echo "📊 CLI Coverage Report:"
          echo "  Statements: ${STATEMENTS}% (required: 65%)"
          echo "  Branches:   ${BRANCHES}% (required: 60%)"
          echo "  Functions:  ${FUNCTIONS}% (required: 70%)"
          echo "  Lines:      ${LINES}% (required: 65%)"

          FAILED=0
          if [ $(echo "$STATEMENTS < 65" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ CLI Statement coverage ${STATEMENTS}% is below 65% threshold"
            FAILED=1
          fi

          if [ $(echo "$BRANCHES < 60" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ CLI Branch coverage ${BRANCHES}% is below 60% threshold"
            FAILED=1
          fi

          if [ $(echo "$FUNCTIONS < 70" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ CLI Function coverage ${FUNCTIONS}% is below 70% threshold"
            FAILED=1
          fi

          if [ $(echo "$LINES < 65" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ CLI Line coverage ${LINES}% is below 65% threshold"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi

          echo "✅ CLI coverage thresholds met!"

      - name: Upload CLI coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-cli
          path: packages/cli/coverage/
          retention-days: 1
          if-no-files-found: ignore

  test-coverage-exocortex:
    # Bare ubuntu-latest — narrow node-only regression suite, no browser needed.
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Run exocortex grounding regression tests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI: "true"
        run: |
          node ./node_modules/jest/bin/jest.js \
            --config packages/exocortex/jest.config.js \
            --testPathPatterns='services/(GroundingExecutor|AssetConversionService)\.test\.ts' \
            --forceExit

  test-coverage:
    # Bare ubuntu-latest aggregator — only runs istanbul merge + threshold
    # checks in pure Node. jq is preinstalled on ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [test-coverage-shard, test-coverage-cli, test-coverage-exocortex]
    if: always()

    steps:
      - name: Verify upstream jobs succeeded
        run: |
          if [ "${{ needs.test-coverage-shard.result }}" != "success" ]; then
            echo "❌ test-coverage-shard failed"
            exit 1
          fi
          if [ "${{ needs.test-coverage-cli.result }}" != "success" ]; then
            echo "❌ test-coverage-cli failed"
            exit 1
          fi
          if [ "${{ needs.test-coverage-exocortex.result }}" != "success" ]; then
            echo "❌ test-coverage-exocortex failed"
            exit 1
          fi
          echo "✅ All upstream coverage jobs passed"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Download obsidian-plugin shard coverage
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      - name: Merge obsidian-plugin coverage
        run: |
          mkdir -p packages/obsidian-plugin/coverage
          node scripts/merge-coverage.js coverage-shards packages/obsidian-plugin/coverage

      - name: Check coverage thresholds (obsidian-plugin)
        run: |
          echo "=============================================="
          echo "Verifying obsidian-plugin coverage thresholds"
          echo "=============================================="

          COVERAGE_FILE="packages/obsidian-plugin/coverage/coverage-summary.json"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ Coverage report not found at $COVERAGE_FILE"
            echo "The merge step did not produce a summary."
            exit 1
          fi

          STATEMENTS=$(cat "$COVERAGE_FILE" | jq -r '.total.statements.pct')
          BRANCHES=$(cat "$COVERAGE_FILE" | jq -r '.total.branches.pct')
          FUNCTIONS=$(cat "$COVERAGE_FILE" | jq -r '.total.functions.pct')
          LINES=$(cat "$COVERAGE_FILE" | jq -r '.total.lines.pct')

          echo "📊 obsidian-plugin Coverage Report (merged across shards):"
          echo "  Statements: ${STATEMENTS}% (required: 75.5%)"
          echo "  Branches:   ${BRANCHES}% (required: 63%)"
          echo "  Functions:  ${FUNCTIONS}% (required: 69%)"
          echo "  Lines:      ${LINES}% (required: 76%)"

          FAILED=0
          if [ $(echo "$STATEMENTS < 75.5" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ Statement coverage ${STATEMENTS}% is below 75.5% threshold"
            FAILED=1
          fi

          if [ $(echo "$BRANCHES < 63" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ Branch coverage ${BRANCHES}% is below 63% threshold"
            FAILED=1
          fi

          if [ $(echo "$FUNCTIONS < 69" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ Function coverage ${FUNCTIONS}% is below 69% threshold"
            FAILED=1
          fi

          if [ $(echo "$LINES < 76" | awk '{print ($1 < $3) ? 1 : 0}') -eq 1 ]; then
            echo "❌ Line coverage ${LINES}% is below 76% threshold"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi

          echo "✅ obsidian-plugin coverage thresholds met!"

      - name: Generate coverage summary
        if: always()
        run: |
          COVERAGE_DIR="packages/obsidian-plugin/coverage"
          if [ -f "$COVERAGE_DIR/lcov.info" ]; then
            echo "## Code Coverage Report" > coverage-summary.md
            echo "" >> coverage-summary.md
            cat "$COVERAGE_DIR/lcov-report/index.html" | grep -A 5 "class='fraction'" | head -20 >> coverage-summary.md || true
            echo "" >> coverage-summary.md
            echo "Full report available in coverage artifacts" >> coverage-summary.md
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            packages/obsidian-plugin/coverage/
            coverage-summary.md
          retention-days: 30
          if-no-files-found: ignore

  test-bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Run BDD Tests
        run: npm run bdd:test
        continue-on-error: true

      - name: Check BDD Coverage
        run: npm run bdd:check
        continue-on-error: false

      - name: Generate BDD Coverage Report
        if: always()
        run: npm run bdd:report

      - name: Upload BDD Coverage Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bdd-coverage-report
          path: bdd-coverage-report.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload BDD Test Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bdd-test-report
          path: packages/obsidian-plugin/reports/
          retention-days: 30
          if-no-files-found: ignore

  test-component:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    # Skip on docs-only PRs (no packages/ or spec/test changes). Push events
    # and force-e2e-labelled PRs always run. Skipped required checks are
    # treated as passing by GitHub branch protection.
    if: >-
      github.event_name == 'push' ||
      needs.detect-changes.outputs.code == 'true' ||
      needs.detect-changes.outputs.force == 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps (+ build)
        uses: ./.github/actions/setup-node-pnpm
        with:
          run-build: "true"
          cache-key-extra: "playwright-jammy"

      - name: Run component tests (excluding visual)
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          # Run component tests excluding visual regression tests
          # Visual tests run separately with --update-snapshots for CI
          npx playwright test -c packages/obsidian-plugin/playwright-ct.config.ts --grep-invert visual

      - name: Run visual regression tests (update snapshots if missing)
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          # Check if Linux snapshots exist, if not generate them
          if ! ls packages/obsidian-plugin/tests/component/__snapshots__/**/*-linux.png 2>/dev/null | head -1; then
            echo "Linux snapshots not found, generating baseline snapshots..."
            npx playwright test -c packages/obsidian-plugin/playwright-ct.config.ts --grep visual --update-snapshots || true
          else
            echo "Running visual regression tests against existing snapshots..."
            npx playwright test -c packages/obsidian-plugin/playwright-ct.config.ts --grep visual
          fi
        continue-on-error: true

      - name: Upload component test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: component-test-report
          path: playwright-report-ct/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload component test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: component-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diff
          path: |
            packages/obsidian-plugin/tests/component/__snapshots__/**/*-diff.png
            packages/obsidian-plugin/tests/component/__snapshots__/**/*-actual.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Linux baseline snapshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-visual-snapshots
          path: packages/obsidian-plugin/tests/component/__snapshots__/**/*-linux.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Track Flaky Tests (Component)
        if: always()
        run: |
          cd packages/obsidian-plugin
          # Check if flaky report was generated
          if [ -f "flaky-report-playwright.json" ]; then
            echo "📊 Playwright Flaky Test Report Generated"
            cat flaky-report-playwright.json

            # Check if any flaky tests were detected
            FLAKY_COUNT=$(cat flaky-report-playwright.json | grep -o '"totalFlaky":[0-9]*' | grep -o '[0-9]*' || echo "0")
            if [ "$FLAKY_COUNT" -gt 0 ]; then
              echo ""
              echo "⚠️ WARNING: $FLAKY_COUNT flaky component test(s) detected!"
              echo "Flaky tests indicate race conditions or timing issues."
              echo "Please investigate and fix these tests."
            fi
          else
            echo "No flaky report generated (no retries occurred)"
          fi

      - name: Upload Flaky Test Report (Component)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flaky-test-report-component
          path: packages/obsidian-plugin/flaky-report-playwright.json
          retention-days: 30
          if-no-files-found: ignore

  test-pyramid:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [test-unit, test-coverage]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps
        uses: ./.github/actions/setup-node-pnpm

      - name: Download coverage reports
        uses: actions/download-artifact@v7
        with:
          name: coverage-reports
          path: packages/obsidian-plugin/coverage/
        continue-on-error: true

      - name: Run Test Pyramid Health Check
        run: npm run test:pyramid

      - name: Validate Test Pyramid (Strict)
        run: npm run test:pyramid:strict
        continue-on-error: false

      - name: Generate Pyramid Report
        if: always()
        run: |
          npm run test:pyramid -- --json > test-pyramid-report.json
          echo "## Test Pyramid Report" > test-pyramid-summary.md
          echo "" >> test-pyramid-summary.md
          echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> test-pyramid-summary.md
          echo "" >> test-pyramid-summary.md
          npm run test:pyramid >> test-pyramid-summary.md

      - name: Upload Pyramid Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-pyramid-report
          path: |
            test-pyramid-report.json
            test-pyramid-summary.md
          retention-days: 30
          if-no-files-found: ignore

  # E2E tests with sharding for faster execution
  # Target: 5 minutes (down from 15 minutes)
  # Note: Named e2e-shard-* to avoid conflict with branch protection rule for "e2e-tests"
  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, detect-changes]
    # NOTE: no job-level `if:` here — matrix-job skip collapses to a single
    # base `e2e-shard` check-run, dropping the branch-protected parenthesised
    # `e2e-shard (1..4)` required check names. Instead, the job always starts,
    # then each step is gated on `env.RUN_E2E`. On docs-only PRs the runner
    # exits in ~15-30s after skipping every heavy step, registering an
    # individual `e2e-shard (N)` check-run with conclusion `success` — which
    # satisfies branch protection.
    env:
      RUN_E2E: ${{ github.event_name == 'push' || needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.force == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Announce gating decision
        run: |
          echo "RUN_E2E=${RUN_E2E}"
          if [ "$RUN_E2E" = "true" ]; then
            echo "::notice::Running e2e shard ${{ matrix.shard }}/4 (code change detected)"
          else
            echo "::notice::Skipping e2e shard ${{ matrix.shard }}/4 (docs-only PR — detect-changes gate)"
          fi

      - name: Checkout
        if: env.RUN_E2E == 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download built plugin
        if: env.RUN_E2E == 'true'
        uses: actions/download-artifact@v7
        with:
          name: plugin-build
          path: .

      - name: Set up Docker Buildx
        if: env.RUN_E2E == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build E2E Docker image
        if: env.RUN_E2E == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/obsidian-plugin/Dockerfile.e2e
          load: true
          tags: exocortex-e2e:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        if: env.RUN_E2E == 'true'
        run: |
          mkdir -p test-results-e2e playwright-report-e2e blob-report
          docker run --init --rm \
            -v $PWD/test-results-e2e:/app/test-results \
            -v $PWD/playwright-report-e2e:/app/playwright-report-e2e \
            -v $PWD/blob-report:/app/packages/obsidian-plugin/blob-report \
            -e CI=true \
            exocortex-e2e npx playwright test -c packages/obsidian-plugin/playwright-e2e.config.ts --shard=${{ matrix.shard }}/4

      - name: Upload blob report for shard ${{ matrix.shard }}
        if: always() && env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: e2e-blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload E2E test artifacts (videos, screenshots, traces) for shard ${{ matrix.shard }}
        if: always() && env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-artifacts-${{ matrix.shard }}
          path: test-results-e2e/
          retention-days: 7
          if-no-files-found: ignore

  # Merge E2E test reports from all shards
  # Named "e2e-tests" to satisfy branch protection rule
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [e2e-shard, detect-changes]
    if: always()
    env:
      RUN_E2E: ${{ github.event_name == 'push' || needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.force == 'true' }}

    steps:
      - name: Check shard results
        run: |
          # needs.e2e-shard.result: 'success' | 'failure' | 'skipped' | 'cancelled'
          # On docs-only PRs each shard finishes quickly with 'success' after
          # the inner-step-skip gate, so 'success' covers both real-pass and
          # no-op-pass. Only 'failure' / 'cancelled' block the aggregator.
          RESULT="${{ needs.e2e-shard.result }}"
          case "$RESULT" in
            success)
              if [ "$RUN_E2E" = "true" ]; then
                echo "✅ All E2E shards passed"
              else
                echo "✅ E2E shards no-op-passed (docs-only PR — detect-changes gate)"
              fi
              ;;
            skipped)
              echo "✅ E2E shards skipped (upstream job-level skip)"
              ;;
            *)
              echo "❌ E2E shards reported result: $RESULT"
              exit 1
              ;;
          esac

      - name: Checkout
        if: env.RUN_E2E == 'true'
        uses: actions/checkout@v6

      # Phase 3 exit gate (task 574476fc 2026-04-22):
      # Aggregator previously ran `actions/setup-node@v4` + `npm install -D
      # @playwright/test` (~18s). Replaced with the cached composite action
      # (`@playwright/test` is already a root devDependency, version-locked
      # via package-lock.json). Cache-hit path is ~8-10s, saving ~8-10s on
      # the critical path.
      - name: Setup Node & install deps
        if: env.RUN_E2E == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Download all blob reports
        if: env.RUN_E2E == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Download all test artifacts (videos, screenshots, traces)
        if: env.RUN_E2E == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-test-artifacts-*
          path: all-test-artifacts
          merge-multiple: true

      - name: Merge E2E reports
        if: env.RUN_E2E == 'true'
        run: |
          npx playwright merge-reports --reporter html ./all-blob-reports
        continue-on-error: true

      - name: Upload merged E2E test report
        if: env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload merged test artifacts (videos, screenshots, traces)
        if: env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-artifacts
          path: all-test-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    # Skip on docs-only PRs — performance regression detection is only
    # meaningful when production code / perf benchmarks / deps change.
    if: >-
      github.event_name == 'push' ||
      needs.detect-changes.outputs.code == 'true' ||
      needs.detect-changes.outputs.force == 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node & install deps (+ build)
        uses: ./.github/actions/setup-node-pnpm
        with:
          run-build: "true"
          cache-key-extra: "playwright-jammy"

      - name: Run unit-level performance tests
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run test:perf

      - name: Run component rendering performance tests
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run test:perf:component
        continue-on-error: true

      - name: Generate Performance Report Summary
        if: always()
        run: |
          echo "## Performance Test Results" > performance-summary.md
          echo "" >> performance-summary.md
          echo "**Run Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> performance-summary.md
          echo "" >> performance-summary.md
          echo "### Test Categories" >> performance-summary.md
          echo "" >> performance-summary.md
          echo "| Category | Status |" >> performance-summary.md
          echo "|----------|--------|" >> performance-summary.md
          echo "| SPARQL Query Performance | ✅ |" >> performance-summary.md
          echo "| Triple Store Performance | ✅ |" >> performance-summary.md
          echo "| RDF Mapping Performance | ✅ |" >> performance-summary.md
          echo "| Rendering Helpers Performance | ✅ |" >> performance-summary.md
          echo "| Component Rendering Performance | ✅ |" >> performance-summary.md
          echo "" >> performance-summary.md
          echo "### Benchmark Targets" >> performance-summary.md
          echo "" >> performance-summary.md
          echo "| Operation | Target | Max Acceptable |" >> performance-summary.md
          echo "|-----------|--------|----------------|" >> performance-summary.md
          echo "| Simple SELECT (10k triples) | 100ms | 200ms |" >> performance-summary.md
          echo "| Complex JOIN | 500ms | 1000ms |" >> performance-summary.md
          echo "| FILTER with REGEX | 300ms | 600ms |" >> performance-summary.md
          echo "| Table render (100 rows) | 2000ms | 4000ms |" >> performance-summary.md
          echo "| Component re-render | 500ms | 1000ms |" >> performance-summary.md

      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-test-report
          path: performance-summary.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Component Performance Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: component-performance-report
          path: playwright-report-ct/
          retention-days: 30
          if-no-files-found: ignore
