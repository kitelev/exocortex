name: Auto Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get last release tag
        id: last_tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"
          echo "tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Get commits since last tag
        id: commits
        run: |
          LAST_TAG="${{ steps.last_tag.outputs.tag }}"
          COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"%s" --no-merges)
          echo "Commits since $LAST_TAG:"
          echo "$COMMITS"

          # Check if there are any commits
          if [ -z "$COMMITS" ]; then
            echo "No new commits since last release"
            echo "has_commits=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_commits=true" >> $GITHUB_OUTPUT

          # Save commits to file for changelog generation
          echo "$COMMITS" > commits.txt

      - name: Determine version bump type
        id: bump_type
        if: steps.commits.outputs.has_commits == 'true'
        run: |
          COMMITS=$(cat commits.txt)

          # Check for BREAKING CHANGE
          if echo "$COMMITS" | grep -qE "(BREAKING CHANGE|^[a-z]+\!:)"; then
            echo "Detected BREAKING CHANGE → major bump"
            echo "type=major" >> $GITHUB_OUTPUT
          # Check for feat:
          elif echo "$COMMITS" | grep -qE "^feat(\([a-z]+\))?:"; then
            echo "Detected feat: → minor bump"
            echo "type=minor" >> $GITHUB_OUTPUT
          # Everything else is patch
          else
            echo "Detected fix/chore/etc → patch bump"
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: new_version
        if: steps.commits.outputs.has_commits == 'true'
        run: |
          LAST_TAG="${{ steps.last_tag.outputs.tag }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"

          # Remove 'v' prefix if present
          LAST_VERSION="${LAST_TAG#v}"

          # Parse version components
          IFS='.' read -r major minor patch <<< "$LAST_VERSION"

          # Bump version based on type
          case "$BUMP_TYPE" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          NEW_VERSION="$major.$minor.$patch"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        if: steps.commits.outputs.has_commits == 'true'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          if git tag -l "v$NEW_VERSION" | grep -q "v$NEW_VERSION"; then
            echo "Tag v$NEW_VERSION already exists, skipping release"
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v$NEW_VERSION does not exist, proceeding with release"
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Update package.json and manifest.json
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          # Update package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Update manifest.json in plugin package
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('packages/obsidian-plugin/manifest.json', 'utf8'));
            manifest.version = '$NEW_VERSION';
            fs.writeFileSync('packages/obsidian-plugin/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "

          echo "Updated package.json and manifest.json to version $NEW_VERSION"

      - name: Install dependencies
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: npm ci

      - name: Build plugin
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: npm run build

      - name: Create release package
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          mkdir release-files
          cp packages/obsidian-plugin/main.js packages/obsidian-plugin/manifest.json release-files/
          [ -f packages/obsidian-plugin/styles.css ] && cp packages/obsidian-plugin/styles.css release-files/ || true
          cd release-files
          zip -r ../${{ github.event.repository.name }}.zip ./*

      - name: Validate BRAT compatibility
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          echo "🔍 Validating BRAT compatibility..."

          # BRAT requires these files for auto-update functionality
          # See: https://github.com/TfTHacker/obsidian42-brat
          REQUIRED_FILES=(
            "packages/obsidian-plugin/main.js"
            "packages/obsidian-plugin/manifest.json"
          )

          # styles.css is optional but expected
          OPTIONAL_FILES=(
            "packages/obsidian-plugin/styles.css"
          )

          MISSING_FILES=()

          # Check required files
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_FILES+=("$file")
              echo "❌ Missing REQUIRED: $file"
            else
              SIZE=$(stat -c%s "$file")
              echo "✅ Found: $file ($SIZE bytes)"
            fi
          done

          # Check optional files (warn but don't fail)
          for file in "${OPTIONAL_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "⚠️  Optional missing: $file"
            else
              SIZE=$(stat -c%s "$file")
              echo "✅ Found: $file ($SIZE bytes)"
            fi
          done

          # Fail if any required files are missing
          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo ""
            echo "💥 BRAT compatibility check FAILED!"
            echo "Missing required files for BRAT auto-update:"
            printf '  - %s\n' "${MISSING_FILES[@]}"
            exit 1
          fi

          echo ""
          echo "✅ BRAT compatibility validated successfully"
          echo "   Plugin can be installed via BRAT using: kitelev/exocortex"

      - name: Generate changelog from commits
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.new_version.outputs.version }}" \
          DATE=$(date +%Y-%m-%d) \
          COMMITS_FILE="commits.txt" \
          OUTPUT_FILE="release_notes.md" \
          node .github/scripts/generate-changelog.js

      - name: Add BRAT installation instructions to release notes
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          cat >> release_notes.md << 'EOF'

          ---

          ## Installation

          ### Via BRAT (Recommended for Beta Testing)

          1. Install [BRAT](https://github.com/TfTHacker/obsidian42-brat) from Obsidian Community Plugins
          2. Open BRAT settings → **Add Beta Plugin**
          3. Enter: `kitelev/exocortex`
          4. Click **Add Plugin** and enable in Community Plugins

          BRAT will automatically update the plugin when new releases are published.

          ### Manual Installation

          1. Download `main.js`, `manifest.json`, and `styles.css` from this release
          2. Create folder: `<vault>/.obsidian/plugins/exocortex/`
          3. Copy downloaded files to the folder
          4. Reload Obsidian and enable the plugin
          EOF

      - name: Create git tag
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Create GitHub Release
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          files: |
            packages/obsidian-plugin/main.js
            packages/obsidian-plugin/manifest.json
            packages/obsidian-plugin/styles.css
            ${{ github.event.repository.name }}.zip
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Setup npm for publishing
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Update CLI package version
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('packages/cli/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Updated CLI package.json to version $NEW_VERSION"

      - name: Publish CLI to npm
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          cd packages/cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          echo "✅ Release v${{ steps.new_version.outputs.version }} created successfully"
          echo "📦 Tag: v${{ steps.new_version.outputs.version }}"
          echo "📝 Changelog generated from commits"
          echo "📤 CLI published to npm as @kitelev/exocortex-cli@${{ steps.new_version.outputs.version }}"
