name: Flaky Dashboard Aggregator

# RFC Phase 3.4 / T4.1+T4.2 — aggregate flaky-reporter.json artifacts from the
# last 30 main CI runs, render a markdown dashboard, and open an auto-merge PR
# refreshing FLAKY_DASHBOARD.md (+ companion JSON) on main. PR flow is required
# because main has 13 required status checks and no bypass for
# github-actions[bot] — direct pushes are rejected.

on:
  schedule:
    # Mondays 06:00 UTC (≈11:00 Asia/Almaty, after weekend lull)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Rolling window size (number of recent main runs)"
        required: false
        default: "30"
      dry_run:
        description: "Skip artifact downloads"
        required: false
        default: "false"
      skip_commit:
        description: "Render dashboard but skip auto-commit PR"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: flaky-dashboard
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need write history for the auto-commit step
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install root deps (tsx)
        run: npm ci --no-audit --no-fund

      - name: Run flaky-aggregate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIMIT="${{ inputs.limit || '30' }}"
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          mkdir -p packages/obsidian-plugin/docs
          npx tsx packages/obsidian-plugin/scripts/flaky-aggregate.ts \
            --repo "${{ github.repository }}" \
            --workflow ci.yml \
            --branch main \
            --limit "$LIMIT" \
            --output packages/obsidian-plugin/docs/FLAKY_DASHBOARD.json \
            $DRY_RUN_FLAG

      - name: Render markdown dashboard
        run: |
          npx tsx packages/obsidian-plugin/scripts/flaky-render-markdown.ts \
            --input packages/obsidian-plugin/docs/FLAKY_DASHBOARD.json \
            --output packages/obsidian-plugin/docs/FLAKY_DASHBOARD.md \
            --repo "${{ github.repository }}"

      - name: Show summary
        run: |
          if [ -f packages/obsidian-plugin/docs/FLAKY_DASHBOARD.json ]; then
            echo "## Flaky Dashboard Summary" >> "$GITHUB_STEP_SUMMARY"
            jq -r '
              "- generatedAt: \(.generatedAt)",
              "- runs analyzed: \(.summary.totalRuns)",
              "- runs with flaky: \(.summary.runsWithFlaky)",
              "- rerun rate: \(.summary.rerunRatePercent)%",
              "- avg flaky/run: \(.summary.averageFlakyPerRun)"
            ' packages/obsidian-plugin/docs/FLAKY_DASHBOARD.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f packages/obsidian-plugin/docs/FLAKY_DASHBOARD.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>FLAKY_DASHBOARD.md</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat packages/obsidian-plugin/docs/FLAKY_DASHBOARD.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload dashboard artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flaky-dashboard
          path: |
            packages/obsidian-plugin/docs/FLAKY_DASHBOARD.json
            packages/obsidian-plugin/docs/FLAKY_DASHBOARD.md
          retention-days: 90
          if-no-files-found: warn

      - name: Open dashboard refresh PR
        if: ${{ inputs.skip_commit != 'true' && inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the dashboard outputs — keep the commit narrow.
          git add packages/obsidian-plugin/docs/FLAKY_DASHBOARD.md \
                  packages/obsidian-plugin/docs/FLAKY_DASHBOARD.json
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi

          BRANCH="chore/flaky-dashboard-refresh"
          # Always overwrite the dedicated branch to keep history shallow.
          git checkout -B "$BRANCH"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git commit -m "chore(ci): refresh flaky dashboard" \
                     -m "Generated by Flaky Dashboard Aggregator." \
                     -m "Run: ${RUN_URL}"
          git push --force-with-lease origin "$BRANCH"

          # Reuse existing PR if already open; otherwise create one.
          EXISTING="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number' || true)"
          if [ -n "$EXISTING" ]; then
            echo "Reusing PR #$EXISTING"
            PR_NUMBER="$EXISTING"
            gh pr comment "$PR_NUMBER" \
              --body "Dashboard refreshed by run ${RUN_URL}." || true
          else
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(ci): refresh flaky dashboard" \
              --body "Auto-generated weekly refresh of FLAKY_DASHBOARD.md (RFC Phase 3.4). Source: ${RUN_URL}.")"
            echo "Created $PR_URL"
            PR_NUMBER="$(echo "$PR_URL" | sed -E 's#.*/##')"
          fi

          # Enable auto-merge so the PR lands once required checks pass.
          gh pr merge "$PR_NUMBER" --squash --auto || \
            echo "auto-merge enable failed (will require manual merge)"
