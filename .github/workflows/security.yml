name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly scan on Sunday at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "## NPM Security Audit Report" > npm-audit-report.md
          echo "" >> npm-audit-report.md
          echo "**Scan Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> npm-audit-report.md
          echo "" >> npm-audit-report.md

          # Run audit and capture output
          set +e
          npm audit --audit-level=moderate 2>&1 | tee npm-audit-output.txt
          AUDIT_EXIT_CODE=$?
          set -e

          if [ $AUDIT_EXIT_CODE -eq 0 ]; then
            echo "### Result: No vulnerabilities found" >> npm-audit-report.md
            echo "" >> npm-audit-report.md
            echo "All dependencies passed security audit at moderate level." >> npm-audit-report.md
          else
            echo "### Result: Vulnerabilities detected" >> npm-audit-report.md
            echo "" >> npm-audit-report.md
            echo '```' >> npm-audit-report.md
            cat npm-audit-output.txt >> npm-audit-report.md
            echo '```' >> npm-audit-report.md
          fi

          # Also generate JSON report for further processing
          npm audit --json > npm-audit-report.json || true

          # Exit with audit result
          exit $AUDIT_EXIT_CODE

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: |
            npm-audit-report.md
            npm-audit-report.json
          retention-days: 30
          if-no-files-found: ignore

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on pull requests
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # Fail on high and critical vulnerabilities
          fail-on-severity: high
          # Allow specific licenses
          allow-licenses: MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, Unlicense, CC0-1.0, BlueOak-1.0.0

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [npm-audit]
    if: always() && github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download npm audit report
        uses: actions/download-artifact@v8
        with:
          name: npm-audit-report
          path: reports/
        continue-on-error: true

      - name: Generate Weekly Security Summary
        run: |
          echo "# Weekly Security Report" > security-summary.md
          echo "" >> security-summary.md
          echo "**Generated:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> security-summary.md
          echo "**Repository:** ${{ github.repository }}" >> security-summary.md
          echo "" >> security-summary.md
          echo "## Scans Performed" >> security-summary.md
          echo "" >> security-summary.md
          echo "| Scan Type | Status |" >> security-summary.md
          echo "|-----------|--------|" >> security-summary.md
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> security-summary.md
          echo "" >> security-summary.md
          echo "## Recommendations" >> security-summary.md
          echo "" >> security-summary.md
          echo "1. Review any vulnerabilities detected in npm audit" >> security-summary.md
          echo "2. Review and merge security-related PRs" >> security-summary.md
          echo "" >> security-summary.md
          echo "---" >> security-summary.md
          echo "" >> security-summary.md
          echo "*This report is automatically generated every Sunday at 00:00 UTC*" >> security-summary.md

      - name: Upload weekly report
        uses: actions/upload-artifact@v7
        with:
          name: weekly-security-report
          path: security-summary.md
          retention-days: 90

  # ⛔ TEMPORARY PROBE (#4488) — remove before opening the PR. Measures whether the
  # job-scoped GITHUB_TOKEN can read branch protection, which decides whether the
  # release gate can DERIVE the required-check list instead of hardcoding it.
  probe-protection-token:
    name: PROBE required_status_checks via GITHUB_TOKEN
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET branches/main/protection/required_status_checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for p in \
            "branches/main" \
            "commits/main/check-runs?per_page=100" \
            "commits/main/status"
          do
            CODE=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/$p")
            echo "=== $p -> HTTP $CODE"
            case "$p" in
              branches/main)
                echo "--- .protection:"; jq -c '.protection' /tmp/body.json
                echo "--- .protection.required_status_checks.contexts:"; jq -c '.protection.required_status_checks.contexts // "ABSENT"' /tmp/body.json
                echo "--- .protection_url present:"; jq -r 'has("protection_url")' /tmp/body.json ;;
              commits/main/check-runs*)
                echo "--- total_count + names:"; jq -c '{total:.total_count, names:[.check_runs[].name]|sort}' /tmp/body.json ;;
              commits/main/status)
                echo "--- state + contexts:"; jq -c '{state:.state, n:(.statuses|length)}' /tmp/body.json ;;
            esac
          done
          echo "=== token scopes advertised by the API:"
          curl -sS -D /tmp/h -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}"
          grep -i '^x-oauth-scopes\|^x-accepted-oauth-scopes' /tmp/h || echo "(none advertised)"
