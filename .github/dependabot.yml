# Restored 2026-08-20 (issue #4128). Файл был снесён ПОБОЧНО 2025-12-14 коммитом
# 4e42ceaa «refactor: rename packages» (512 файлов) — плановых обновлений не было
# восемь месяцев. Security-updates при этом работали (они включаются в настройках
# репо, а не здесь), и живые security-PR маскировали мёртвый плановый канал.
#
# ⛔ Три npm-записи — это НЕ дубль. В репо три package-lock.json, и корневой
# покрывает только workspaces (`packages/*`):
#   /               — корневой лок, весь workspace-граф
#   /packages/core  — СВОЙ лок; он вход `npm audit` job-а npm-audit-exocortex
#                     (ci.yml: working-directory: packages/core) и его
#                     cache-dependency-path. Без этой записи он дрейфует от
#                     корневого — что и наблюдалось: js-yaml 3.14.2 против 3.15.1.
#   /docs-site      — ВНЕ workspaces корня, поэтому корневая запись его не видит.
#
# ⛤ `reviewers:` из прежней версии убран — ключ deprecated в схеме Dependabot.
# CODEOWNERS в репо нет, PR и так приходят владельцу.
version: 2

updates:
  # ── npm: корневой лок (весь workspace-граф) ────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    # ⛤ 3, а не прежние 10: после восьми месяцев тишины накопленная дельта
    # выльется залпом. Поднять, когда первая волна разгребена.
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      production-dependencies:
        patterns: ["*"]
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          # ⛔ @typescript-eslint/* НЕ покрывается ни `eslint*` (начинается с @),
          # ни `typescript` (точное совпадение) — без этой строки пакет попал бы
          # и в production-группу, и в linters.
          - "@typescript-eslint/*"
          - "prettier*"
          - "jest*"
          - "@jest/*"
          # ⛔ ts-jest не покрывается `jest*` — он начинается с `ts-`.
          - "ts-jest"
          - "typescript"
          - "@playwright/*"
          - "playwright*"
        update-types: ["minor", "patch"]
      # ⛤ Dev-инструменты РАЗВЕДЕНЫ по семействам, а не свалены в одну группу.
      # Причина замерена на PR #4138: единая dev-группа притащила jest 30.4.2
      # ВМЕСТЕ с jest-environment-jsdom 30.4.1 — разъехавшийся лок-степ внутри
      # семейства дал `TypeError: this._moduleMocker.clearMocksOnScope is not a
      # function`, и в том же PR ехали @playwright/* 1.57→1.62 и
      # eslint-plugin-obsidianmd 0.1.9→0.4.1. Разобрать такой PR нельзя — в нём
      # смешаны несвязанные причины отказа.
      #
      # ⛔ jest и jest-environment-* обязаны двигаться ОДНИМ PR (общий jest-mock),
      # поэтому они в одной группе — но отдельно от всего прочего.
      jest:
        patterns:
          - "jest"
          - "jest-*"
          - "@jest/*"
          - "ts-jest"
        update-types: ["minor", "patch"]
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright*"
        update-types: ["minor", "patch"]
      linters:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier*"
        update-types: ["minor", "patch"]
      types-and-tsc:
        patterns:
          - "@types/*"
          - "typescript"
        update-types: ["minor", "patch"]
    # major-версии этих трёх ломают рантайм плагина — только вручную, с прогоном e2e
    ignore:
      - dependency-name: "obsidian"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # ⛤ @types/node описывает РАНТАЙМ, а рантайм здесь — Node 22 (8 воркфлоу
      # `node-version: "22"`, один на 20). Типы 26 принимают API, которых в этом
      # рантайме нет: замер 2026-08-20 на `packages/core` (lib ES2020/ES2022, БЕЗ
      # DOM) — `new URLPattern(...)` (глобал с Node 24) даёт ошибку под типами 22
      # и компилируется под 26. То есть major-бамп типов открывает окно
      # «tsc принял → Node бросил ReferenceError», причём при зелёном CI.
      # ⇒ снимать этот ignore ВМЕСТЕ с подъёмом `node-version` в .github/workflows,
      #   а не раньше; условие проверяется одним grep-ом по воркфлоу.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ⛔ Записи для /packages/core здесь НЕТ, и это осознанно (проверено замером
  # 2026-08-20, PR #4129 → #4143). `packages/core` — workspace-ЧЛЕН, его зависимости
  # живут в КОРНЕВОМ локе, и корневая запись выше обновляет их правильно: PR #4139
  # тронул package-lock.json + манифесты core/cli/plugin/req-audit синхронно.
  #
  # Отдельная запись `directory: "/packages/core"` обновляет ТОЛЬКО манифест члена
  # и его лок — корневой остаётся прежним, и `npm ci` в корне падает
  # `Missing: <pkg> from lock file` (так упал PR #4140, job NPM Security Audit).
  #
  # ⚠ Остаток: packages/core/package-lock.json продолжает дрейфовать от корневого
  # (js-yaml 3.14.2 против 3.15.1). Он не источник установки — только
  # cache-dependency-path и вход `npm audit --omit=dev` job-а npm-audit-exocortex.
  # Лечится не здесь; см. #4128.

  # ── npm: docs-site (вне workspaces корня) ─────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docs-site:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # Дрейф уже наблюдаем: actions/checkout@v4 и @v6 сосуществуют в одном репо.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
